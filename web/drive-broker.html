<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' https://accounts.google.com; connect-src https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>اتصال به گوگل درایو — کارنامه</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: #f1f5f9;
        color: #0f172a;
        font-family: Vazirmatn, Tahoma, system-ui, sans-serif;
      }
      .card {
        width: min(460px, 100%);
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 26px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      }
      h1 { margin: 0 0 10px; font-size: 20px; }
      p { margin: 0 0 16px; line-height: 1.9; font-size: 14px; color: #475569; }
      code {
        direction: ltr;
        unicode-bidi: embed;
        background: #f1f5f9;
        border-radius: 6px;
        padding: 2px 6px;
        font-size: 12px;
      }
      button {
        width: 100%;
        height: 52px;
        border: 0;
        border-radius: 12px;
        background: #4f46e5;
        color: #fff;
        font-family: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.06); }
      button:disabled { opacity: 0.6; cursor: default; }
      .tiny { margin: 12px 0 0; font-size: 11px; color: #94a3b8; line-height: 1.8; }
      .error { color: #b91c1c; font-weight: 600; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>اتصال به گوگل درایو</h1>
      <p id="msg">
        برای همگام‌سازی پاکا با فایل <code>Paca/paca-sync.json</code> در گوگل درایو، با
        حساب گوگل خود وارد شوید.
      </p>
      <button id="go" type="button">ورود با گوگل</button>
      <p class="tiny">
        این پنجره پس از تأیید بسته می‌شود. دسترسی فقط برای فایل همگام‌سازی پاکاست.
      </p>
    </main>

    <script src="config.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="drive-broker.js"></script>
  </body>
</html>
