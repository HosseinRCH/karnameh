<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>پاکا — نسخهٔ آفلاین</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#4338ca" />
    <link rel="icon" href="icon.png" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><img src="icon.png" alt="" /><span>پاکا</span><small id="platform-badge"></small></div>
        <nav class="tabs" id="tabs">
          <button data-tab="tasks" class="active">کارها</button>
          <button data-tab="focus">تمرکز</button>
          <button data-tab="report">گزارش</button>
          <button data-tab="settings">تنظیمات</button>
        </nav>
        <button id="sync-pill" class="sync-pill" title="همگام‌سازی"></button>
      </header>
      <main id="view"></main>
    </div>
    <div id="timer-bar" class="timer-bar hidden"></div>
    <dialog id="dialog"></dialog>
    <div id="toast" class="toast"></div>
    <script src="config.js"></script>
    <script src="jalali.js"></script>
    <script src="store.js"></script>
    <script src="sync.js"></script>
    <script src="app.js"></script>
    <script src="boot.js"></script>
  </body>
</html>
